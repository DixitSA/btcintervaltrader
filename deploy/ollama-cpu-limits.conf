# Drop-in for ollama.service. Keeps inference from starving the recorder.
#
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp deploy/ollama-cpu-limits.conf /etc/systemd/system/ollama.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# The recorder polls every 2 seconds and its data collection is the long pole
# on this project. Ollama will use every core it is given; a saturated box
# means missed polls, which means gaps in the dataset you are trying to build.
#
# CPUQuota is in percent of ONE core: 200% = two cores. Set it to leave at
# least one core free. Check `nproc` and adjust -- 200% suits a 4-core box.

[Service]
CPUQuota=200%
# Lower scheduling priority than the recorder, so even within the quota the
# recorder wins any contest for the CPU.
Nice=10
IOSchedulingClass=idle
# Free the model from RAM between runs. On a daily digest the reload cost is
# irrelevant and 5 GB of resident memory is not.
Environment=OLLAMA_KEEP_ALIVE=60s
# One request at a time. The crew is sequential anyway, and parallel loads are
# what actually blow up memory on a CPU-only box.
Environment=OLLAMA_NUM_PARALLEL=1
Environment=OLLAMA_MAX_LOADED_MODELS=1

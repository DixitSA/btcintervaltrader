# Drop-in for ollama.service. Keeps inference from starving the recorder.
#
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp deploy/ollama-cpu-limits.conf /etc/systemd/system/ollama.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# Tuned for a 6-core CPU with no GPU and 24 GB RAM. Check `nproc` and
# `free -g` and adjust.

[Service]
# CPUQuota is percent of ONE core: 400% = four cores. On a 6-core box that
# leaves two free.
#
# The recorder needs almost nothing -- one HTTP request every 2 seconds, a JSON
# parse and an appended line, well under 1% of a core. So the limit here is not
# really about arithmetic; it is about never letting a saturated box delay a
# poll. Four cores is a deliberate middle: leaving only two would roughly halve
# generation speed on an 8B model for no real gain in safety.
CPUQuota=400%

# The actual protection. Even inside the quota, the recorder outranks inference
# whenever the two want the same core.
Nice=10
IOSchedulingClass=idle

# How long a model stays resident after its last request.
#
# A sequential crew hands off between agents; if models unload the instant a
# turn ends, the next agent pays a reload from disk. Five minutes covers a
# whole run and still frees the RAM afterwards.
Environment=OLLAMA_KEEP_ALIVE=5m

# Enough slots for a mixed-model crew to stay resident together. Three 4-5 GB
# models is roughly 12 GB, which fits in 24 GB alongside everything else.
# Set this BELOW the number of distinct models a crew uses and Ollama will
# unload and reload between agents -- on CPU that is minutes of pure waste.
Environment=OLLAMA_MAX_LOADED_MODELS=3

# One request at a time regardless. Parallel decoding is what actually blows up
# memory on a CPU-only box, and the crew is sequential anyway.
Environment=OLLAMA_NUM_PARALLEL=1

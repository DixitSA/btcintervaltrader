# Trading configuration. Safe to commit -- no secrets here.
#
# mode is "paper" unless you change it AND set BTCBOT_I_UNDERSTAND_REAL_MONEY=yes.
mode: paper

# Kalshi is the only venue. It is a CFTC-regulated US exchange and charges a
# taker fee up front on every fill (see the fees section below).
venue: kalshi

poll_seconds: 2.0
data_dir: data

kalshi_url: https://api.elections.kalshi.com/trade-api/v2
# api.binance.com returns 451 (geo-blocked) from the US, which makes every
# recorded snapshot carry spot: null -- silently, since the feed only warns.
# data-api.binance.vision is Binance's public market-data mirror: same REST
# shape, same BTCUSDT symbol, same global book, no geo-block.
# NB the settlement source for KXBTC15M is CF Benchmarks BRTI, not Binance;
# this feed is for signals only (see spot.py).
spot_url: https://data-api.binance.vision

markets:
  # Every window family to trade. Key is a short label (btc, eth, sol).
  # Each family defines its Kalshi series ticker (prefix), Binance spot
  # symbol, and strike price bounds.  Adding families is the honest way
  # to raise trade count -- it does not change what you are betting on.
  families:
    btc:
      prefix: KXBTC15M
      spot_symbol: BTCUSDT
      display_name: BTC
      strike_min: 1_000
      strike_max: 10_000_000
    # Strike bounds are a sanity filter on parsed strikes, not a forecast.
    # They must match the asset's decade: SOL trades near $70, so BTC's
    # $1k floor would reject every SOL strike and leave it unsettleable.
    eth:
      prefix: KXETH15M
      spot_symbol: ETHUSDT
      display_name: ETH
      strike_min: 100
      strike_max: 100_000
    sol:
      prefix: KXSOL15M
      spot_symbol: SOLUSDT
      display_name: SOL
      strike_min: 1
      strike_max: 10_000
  # Do not enter in the last 30s: the book thins and you are racing bots with
  # colocated infrastructure you do not have.
  min_seconds_remaining: 30
  max_seconds_remaining: 900
  min_book_depth_usd: 50.0
  max_spread: 0.05

fees:
  # VERIFY THESE against your own fills before trusting any backtest.
  #
  # Kalshi charges a TAKER FEE UP FRONT on every fill:
  #     fee = ceil(0.07 * contracts * P * (1 - P)) rounded up to the cent
  # That peaks at 1.75c per contract at 50c -- 3.5% of a 50c stake, paid on
  # entry AND again on exit if you stop out.
  kalshi_taker_coefficient: 0.07
  kalshi_maker_coefficient: 0.0
  slippage: 0.005

risk:
  bankroll_usd: 100.0
  max_stake_per_trade_usd: 5.0
  max_stake_fraction: 0.02
  max_concurrent_positions: 1
  max_trades_per_hour: 8
  # Cap on the combined cost basis of ALL open positions, as a fraction of the
  # starting bankroll. Raise max_concurrent_positions without raising this and
  # you are risking N times what you think per moment: Kelly sizes each
  # position as though it were your only one.
  max_total_exposure_fraction: 0.10
  daily_loss_limit_usd: 20.0
  max_entry_price: 0.90
  min_entry_price: 0.10
  # Quarter Kelly. Full Kelly on a probability estimate you are not sure of is
  # how accounts go to zero even with a genuine edge.
  kelly_fraction: 0.25

exits:
  # Stop loss / take profit. Thresholds are in PROBABILITY POINTS, not percent:
  # entered at 0.60 with stop_loss_drop 0.15 -> exits when the BID hits 0.45.
  #
  # A stop here means selling back into the book, so you cross the spread a
  # second time. On a near-coin-flip that is a real cost -- noise stops you out
  # of positions that would have won. Measure it before trusting it:
  #   python -m btcbot compare-exits
  enabled: true
  stop_loss_drop: 0.15
  take_profit_rise: null
  trailing_stop_drop: null
  max_hold_seconds: null
  # Do not churn in the final seconds: the book widens and the outcome is
  # nearly decided, so exiting there mostly pays the spread for nothing.
  no_exit_within_seconds: 20.0
  min_hold_seconds: 0.0
  # Account-level kill switch on equity drawdown. Unlike the daily loss limit
  # (closed trades only) this also sees open positions under water.
  max_drawdown_usd: null
  max_drawdown_pct: 0.25

execution:
  # paper -> simulate against the live book (safe, default)
  # venue -> place real orders through Kalshi. Also needs mode: live AND
  #          BTCBOT_I_UNDERSTAND_REAL_MONEY=yes.
  backend: paper

shadow:
  enabled: true
  rungs: [120, 240, 420, 900]
  directions: [follow, fade]
  notional_usd: 1.0
  ledger_file: shadow.jsonl

learning:
  # Online calibration from observed trade outcomes.
  # Disabled by default. Enable after accumulating at least ~100 settled trades —
  # with fewer data points the posterior barely moves from the prior.
  enabled: false
  alpha_prior: 1.0
  beta_prior: 1.0
  outcome_file: outcomes.jsonl

strategy:
  # SIMULATION DEFAULT. always_trade places one bet per window with no volume
  # gate and no edge gate, so `python -m btcbot paper` actually fills, settles,
  # and produces a P&L curve. That is the point: exercise the whole pipeline.
  #
  # assumed_edge is a PLACEHOLDER, not a measured edge. It exists so the risk
  # layer's "edge must survive fees" check passes (spread + Kalshi taker fee
  # eat ~4-5c round trip on a coin flip). Simulated P&L from this config tells
  # you the pipeline works; it does NOT tell you the strategy makes money.
  #
  # For the honest no-edge default (declines everything, by design):
  #   name: volume_threshold
  #   params: {min_volume_usd: 500000, direction: follow, assumed_edge: 0.0}
  name: always_trade
  params:
    direction: follow
    assumed_edge: 0.06

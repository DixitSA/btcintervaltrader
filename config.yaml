# Trading configuration. Safe to commit -- no secrets here.
#
# mode is "paper" unless you change it AND set BTCBOT_I_UNDERSTAND_REAL_MONEY=yes.
mode: paper

poll_seconds: 2.0
data_dir: data

gamma_url: https://gamma-api.polymarket.com
clob_url: https://clob.polymarket.com
spot_url: https://api.binance.com

markets:
  slug_prefix: btc-updown-15m
  window_seconds: 900
  # Do not enter in the last 30s: the book thins and you are racing bots with
  # colocated infrastructure you do not have.
  min_seconds_remaining: 30
  max_seconds_remaining: 900
  min_book_depth_usd: 50.0
  max_spread: 0.05

fees:
  # VERIFY THESE against your own fills before trusting any backtest.
  taker_fee_bps: 0.0
  winnings_fee_bps: 200.0
  slippage: 0.005

risk:
  bankroll_usd: 100.0
  max_stake_per_trade_usd: 5.0
  max_stake_fraction: 0.02
  max_concurrent_positions: 1
  max_trades_per_hour: 8
  daily_loss_limit_usd: 20.0
  max_entry_price: 0.90
  min_entry_price: 0.10
  # Quarter Kelly. Full Kelly on a probability estimate you are not sure of is
  # how accounts go to zero even with a genuine edge.
  kelly_fraction: 0.25

strategy:
  name: volume_threshold
  params:
    min_volume_usd: 500000
    direction: follow
    # 0.0 means "this rule is no better than the market price", which is the
    # honest default. Raise it only if your own backtest justifies it.
    assumed_edge: 0.0
